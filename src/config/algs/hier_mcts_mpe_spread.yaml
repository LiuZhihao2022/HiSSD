# runner: "mt_episode"
runner: "mt_parallel"
mcts_runner: "hier_mcts_parallel_single_task"
# only use for initializing action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000

# update the target network every _ steps
target_update_interval: 80

# use the Q_Learner to train
agent_output_type: "q"
learner: "st_hissd_learner"
double_q: True
mixer: "qmix"
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64

name: "mcts"

# agent type
agent: "st_hissd"

# mac
mac: "st_hissd_mac"
optim_type: "AdamW" # Optimizer type

# params about trans mixing network
entity_embed_dim: 64
attn_embed_dim: 8
# skill_dim: 64
skill_dim: 16
task: 3
# beta: 0.001
beta: 0.05
coef_conservative: 5.0
coef_dist: 5.0
pretrain_steps: 20000
pretrain: False
weight_decay: 0.0001

head: 1
depth: 1
lr: 0.001
# params about observation decomposition
id_length: 4
max_agent: 15

# params about ensemble loss
coef_ensemble: 0.001
coef_kl: 0.1
coef_ent: 0.01
coef_sim: 1.0
random: 0.5
# mask: True
mask: False
td_weight: 10.0
epsilon: 0.9

# planner params
num_stack_frames: 1
vq_skill: True
code_dim: 32
reward_pred_weight: 1.0
# discriminator params
# ssl_type: "moco"
# ssl_type: "byol"
ssl_type: null # 没有使用ssl
ssl_time_window: 4

double_neg: True

noise_weight: 0.
adaptation: False
debug: False
# -----------------------mpe params-----------------------
common_reward: True
use_real_simulator: True
# -----------------------hier-mcts params-----------------------
batch_size: 8 # specially for episode runner
batch_size_run: 8
c_step: 1
#load_wm_path: ""
# mcts_network_path: ""
mcts_network_path: "/home/lzh/HiSSD/results/single_task/mpe/marine-easy-expert/simple_spread-expert/mcts/mcts_2025-05-26_21-44-50/online_models/5200"
load_wm_path: "/home/lzh/HiSSD/results/single_task/mpe/marine-easy-expert/simple_spread-expert/mcts/mcts_2025-05-26_21-44-50/online_models/5200"
use_offline_training: False
use_online_mcts: True # 暂时wm和mcts分开学, 只学stage 1
online_steps: 2000500
# 可以存放多少条数据，不过这个是要和buffer每次采样的size相关的
replay_buffer_list_capacity: 8
batch_size_train_learner: 32
# target_update_interval: 200
num_simulations: 32
max_num_considered_actions: 16
use_mixed_value: False
obs_process_dim: 16
k: 12
temprature: 1.0
value_loss_weight: 0.5
max_grad_norm: 10.0
state_embed_dim: 64
offline_value_start: 1.0
offline_value_end: 1.0
offline_value_anneal_time: 500000
save_model_interval_online: 5000
test_nepisode_online: 32
test_interval_online: 1000
mcts_target_update_interval: 80
use_wandb: True
compute_infonce: False
test_offline_model: False
use_origin_model: False
basic_action_as_skill: True
# mcts_network_path: "/home/lzh/HiSSD/results/hier_mcts/sc2/marine-easy-expert/5m_vs_6m-expert/mcts/mcts_2025-05-06_23-46-11/online_models/10359/"